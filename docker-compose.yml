services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evernine
      POSTGRES_PASSWORD: evernine
      POSTGRES_DB: evernine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evernine -d evernine"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://evernine:evernine@db:5432/evernine
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
